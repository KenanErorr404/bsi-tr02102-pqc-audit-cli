name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR packages
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMG_REPO="ghcr.io/${OWNER_LC}/bsi-tr02102-pqc-audit-cli"
          IMG_SHORT="ghcr.io/${OWNER_LC}/bsi-pqc-audit"
          docker build \
            -t "${IMG_REPO}:latest" \
            -t "${IMG_REPO}:v1.5.0" \
            -t "${IMG_SHORT}:latest" \
            -t "${IMG_SHORT}:v1.5.0" .
          docker push "${IMG_REPO}:latest"
          docker push "${IMG_REPO}:v1.5.0"
          docker push "${IMG_SHORT}:latest"
          docker push "${IMG_SHORT}:v1.5.0"
