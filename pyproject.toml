[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bsi-tr02102-pqc-audit-cli"
version = "1.4.0"
description = "BSI TR-02102-1 (2031 PQC Deadline) & NIS-2 (§ 30 BSIG) Local Crypto-Config & CBOM Scanner (SSH, OpenSSL/TLS, X.509)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "DE-Compliance-Kompass Community" }
]
keywords = [
  "bsi",
  "tr-02102",
  "nis2",
  "post-quantum-cryptography",
  "pqc",
  "cbom",
  "it-grundschutz",
  "diga",
  "tr-03185",
  "cybersecurity-germany"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration"
]
dependencies = []

[project.urls]
Homepage = "https://kenanerorr404.github.io/de-compliance-kompass/"
Calculator = "https://kenanerorr404.github.io/de-compliance-kompass/pqc-nis2-rechner.html"
Repository = "https://github.com/KenanErorr404/bsi-tr02102-pqc-audit-cli"

[project.scripts]
bsi-pqc-check = "bsi_pqc_check:main"

[tool.setuptools]
py-modules = ["bsi_pqc_check"]
